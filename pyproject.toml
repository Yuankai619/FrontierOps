[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "frontierops"
version = "0.1.0"
description = "Agent-agnostic research frontier briefing harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openreview-py>=2.2,<3",
  "pydantic>=2.10,<3",
  "pymupdf>=1.26,<2",
  "PyYAML>=6.0,<7",
]

[project.scripts]
frontier = "frontierops.adapters.cli:main"

[project.optional-dependencies]
alphaxiv = [
    "mcp>=2,<3",
]

[tool.uv]
required-version = ">=0.12.20,<0.14"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
frontierops = ["fixtures/*.json"]
